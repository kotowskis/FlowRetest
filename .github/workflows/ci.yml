name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      # Plan: npm audit at level high; once, not per OS.
      - if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
