name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag against the package versions
        id: version
        run: node scripts/release-check.mjs version "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run verify
      # The npm package and the proxy image; the hosted layer is not released from here.
      - run: npx turbo build --filter=flowretest --filter=@flowretest/proxy
      - name: Proxy image to GHCR and proxy.lock.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowretest-proxy"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$VERSION" packages/proxy
          docker push "$IMAGE:$VERSION"
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          node scripts/release-check.mjs lock "$IMAGE" "$VERSION" "${DIGEST##*@}"
      - name: Keep proxy.lock.json for the commit back to main
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lock
          path: packages/cli/proxy.lock.json
      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          node scripts/release-check.mjs package
          npm publish -w packages/cli --provenance --access public --tag "$DIST_TAG"
