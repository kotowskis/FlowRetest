name: FlowRetest replay
description: Replay recorded n8n executions against a changed workflow in a sealed sandbox and report what it would send.
author: Skynappse

inputs:
  instance-url:
    description: n8n instance URL (public API must be enabled)
    required: true
  api-key:
    description: n8n public API key with workflow:read and execution:read
    required: true
  workflow-id:
    description: Workflow id on the instance
    required: true
  new-file:
    description: Path to the new workflow JSON in the repository
    required: true
  old:
    description: recorded | published | path to the old workflow JSON (e.g. the file from the base branch)
    default: recorded
  engine:
    description: n8n image tag the instance runs (e.g. 2.40.5)
    required: true
  last:
    description: Number of recent successful executions to replay
    default: '10'
  stabilize:
    description: Run both versions twice and mask volatile fields
    default: 'true'
  version:
    description: flowretest version to run
    default: next
  comment:
    description: Post the Markdown plan as a pull request comment (needs pull-requests write permission)
    default: 'true'
  values:
    description: Show request values in the pull request comment and the uploaded report. The default 'false' posts and uploads the redacted plan (type, length and hash instead of values), because the fixtures are production data.
    default: 'false'
  upload-url:
    description: Hosted FlowRetest URL. With upload-token, the redacted report is uploaded and the hosted layer posts a check on the tested commit (GitHub App linked to the workspace).
    default: ''
  upload-token:
    description: Workspace token (FLOWRETEST_TOKEN) from the hosted layer; pass it from a secret
    default: ''

outputs:
  status:
    description: PASS, DIFF, ERROR, BLOCKED, ENVIRONMENT (Docker, API or config problem) or FAILED (internal error)
    value: ${{ steps.run.outputs.status }}
  exit-code:
    description: flowretest exit code
    value: ${{ steps.run.outputs.exit-code }}
  run-url:
    description: URL of the run in the hosted layer, when it was uploaded
    value: ${{ steps.upload.outputs.run-url }}

# Inputs reach the shell only through environment variables, never through ${{ }} inside a script, so a workflow id
# or file name cannot inject commands.
runs:
  using: composite
  steps:
    - name: Init
      shell: bash
      run: npx --yes "flowretest@$FRT_VERSION" init --url "$FRT_URL" --engine "$FRT_ENGINE"
      env:
        FLOWRETEST_API_KEY: ${{ inputs.api-key }}
        FRT_VERSION: ${{ inputs.version }}
        FRT_URL: ${{ inputs.instance-url }}
        FRT_ENGINE: ${{ inputs.engine }}
    - name: Pull fixtures
      shell: bash
      run: npx --yes "flowretest@$FRT_VERSION" pull --workflow "$FRT_WORKFLOW" --last "$FRT_LAST"
      env:
        FLOWRETEST_API_KEY: ${{ inputs.api-key }}
        FRT_VERSION: ${{ inputs.version }}
        FRT_WORKFLOW: ${{ inputs.workflow-id }}
        FRT_LAST: ${{ inputs.last }}
    - name: Replay
      id: run
      shell: bash
      run: |
        set +e
        args=(run --workflow "$FRT_WORKFLOW" --new "$FRT_NEW" --old "$FRT_OLD" --format terminal,junit,md)
        if [ "$FRT_STABILIZE" = "true" ]; then args+=(--stabilize); fi
        npx --yes "flowretest@$FRT_VERSION" "${args[@]}"
        code=$?
        run_dir=$(ls -d ".flowretest/$FRT_WORKFLOW/runs/"*/ 2>/dev/null | sort | tail -1)
        if [ -n "$run_dir" ] && [ "$FRT_VALUES" != "true" ]; then
          npx --yes "flowretest@$FRT_VERSION" redact --workflow "$FRT_WORKFLOW" --report "$(basename "$run_dir")"
        fi
        echo "run-dir=$run_dir" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        case $code in 0) s=PASS;; 1) s=DIFF;; 2) s=ERROR;; 3) s=BLOCKED;; 4) s=ENVIRONMENT;; *) s=FAILED;; esac
        echo "status=$s" >> "$GITHUB_OUTPUT"
        if [ -n "$run_dir" ]; then
          cp "$run_dir/junit.xml" flowretest-junit.xml 2>/dev/null
          if [ "$FRT_VALUES" = "true" ]; then
            cp "$run_dir/plan.md" flowretest-plan.md 2>/dev/null
            cp "$run_dir/report.json" flowretest-report.json 2>/dev/null
          else
            cp "$run_dir/plan.redacted.md" flowretest-plan.md 2>/dev/null
            cp "$run_dir/report.redacted.json" flowretest-report.json 2>/dev/null
          fi
        fi
        exit 0
      env:
        FLOWRETEST_API_KEY: ${{ inputs.api-key }}
        FRT_VERSION: ${{ inputs.version }}
        FRT_WORKFLOW: ${{ inputs.workflow-id }}
        FRT_NEW: ${{ inputs.new-file }}
        FRT_OLD: ${{ inputs.old }}
        FRT_STABILIZE: ${{ inputs.stabilize }}
        FRT_VALUES: ${{ inputs.values }}
    - name: Upload the redacted report to the hosted layer
      id: upload
      if: ${{ inputs.upload-url != '' && inputs.upload-token != '' && steps.run.outputs.run-dir != '' }}
      shell: bash
      # The CLI adds the repository and the pull request head commit from the GitHub Actions environment. A failed
      # upload is reported but does not fail the job; the plan's own result decides that below.
      run: |
        set +e
        url=$(npx --yes "flowretest@$FRT_VERSION" --json upload --workflow "$FRT_WORKFLOW" --run "$(basename "$FRT_RUN_DIR")" --url "$FRT_UPLOAD_URL" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).url)}catch{}})")
        if [ -n "$url" ]; then echo "run-url=$url" >> "$GITHUB_OUTPUT"; echo "FlowRetest plan: $url" >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::flowretest upload failed"; fi
        exit 0
      env:
        FLOWRETEST_TOKEN: ${{ inputs.upload-token }}
        FRT_VERSION: ${{ inputs.version }}
        FRT_WORKFLOW: ${{ inputs.workflow-id }}
        FRT_RUN_DIR: ${{ steps.run.outputs.run-dir }}
        FRT_UPLOAD_URL: ${{ inputs.upload-url }}
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: flowretest-report
        path: |
          flowretest-junit.xml
          flowretest-plan.md
          flowretest-report.json
        if-no-files-found: ignore
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        FRT_WORKFLOW: ${{ inputs.workflow-id }}
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('flowretest-plan.md')) return;
          const body = fs.readFileSync('flowretest-plan.md', 'utf8');
          const marker = `<!-- flowretest:${process.env.FRT_WORKFLOW} -->`;
          const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.includes(marker));
          const payload = { ...context.repo, body: `${marker}\n${body}` };
          if (mine) await github.rest.issues.updateComment({ ...payload, comment_id: mine.id });
          else await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
    - name: Fail the job on ERROR, BLOCKED or a failed run
      shell: bash
      run: |
        case "$FRT_STATUS" in PASS|DIFF) ;; *) echo "flowretest: $FRT_STATUS"; exit 1;; esac
      env:
        FRT_STATUS: ${{ steps.run.outputs.status }}
